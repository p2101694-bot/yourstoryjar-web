<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourStoryJar - 收集你的每一段故事</title>
    <style>
        :root {
            --bg-color: #fbfbfd;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --ink-color: #1e1c24;
            --coffee-bg: #FFDD00;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.animating {
            overflow: hidden;
        }

        /* ================= 圖二：手機版流光 App Icon 樣式 ================= */
        .app-icon-squircle {
            width: 74px;
            height: 74px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 9px;
            position: relative;
            flex-shrink: 0;
        }

        /* 深色圓角背景層（支援升到頂部後才絲滑浮現） */
        .app-icon-squircle::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: radial-gradient(circle at 26% 24%, #4e3a4d 0%, #251f2d 56%, #16131c 100%);
            box-shadow: 
                0 12px 28px rgba(22, 19, 28, 0.28),
                inset 0 1px 1.5px rgba(255, 255, 255, 0.22);
            z-index: 0;
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-icon-squircle svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            position: relative;
            z-index: 1;
        }

        /* 開場分裂與上升期間：僅顯示黑線罐子，隱藏深色背景與流光 */
        #splash-icon2 {
            opacity: 0;
        }

        #splash-icon2::before {
            opacity: 0;
            transform: scale(0.86);
        }

        #splash-icon2 .jar-ink-layer {
            opacity: 1;
            transition: opacity 0.65s ease;
        }

        #splash-icon2 .jar-holo-layer {
            opacity: 0;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.6))
                    drop-shadow(0 0 8px rgba(195, 230, 255, 0.35));
            transition: opacity 0.65s ease;
        }

        /* 升到頂部後觸發：絲滑上色 + 浮現深色背景成為完整 Icon */
        #splash-icon2.colorize-active::before {
            opacity: 1;
            transform: scale(1);
        }

        #splash-icon2.colorize-active .jar-ink-layer {
            opacity: 0;
        }

        #splash-icon2.colorize-active .jar-holo-layer {
            opacity: 1;
        }

        /* 目標 Header 上的最終 Icon 預設完整顯示 */
        #target-brand-lockup .app-icon-squircle::before {
            opacity: 1;
            transform: scale(1);
        }

        #target-brand-lockup .jar-holo-layer {
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.6))
                    drop-shadow(0 0 8px rgba(195, 230, 255, 0.35));
        }

        /* ================= 開場全螢幕動畫舞台 ================= */
        #splash-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: background-color 0.75s ease;
        }

        #splash-overlay.transparent-bg {
            background-color: rgba(251, 251, 253, 0);
            pointer-events: none;
        }

        #splash-overlay.hidden {
            display: none;
        }

        /* 動畫核心定位容器（負責帶動文字與黑線罐子一起向上升起貼合） */
        #anim-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 連續線條變形畫布 (SVG Morph Layer) */
        #morph-svg-layer {
            position: absolute;
            width: 720px;
            height: 280px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        /* 最終分裂並排的品牌組合 (YourStory + 罐子) */
        #split-lockup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            position: relative;
            z-index: 2;
        }

        .brand-title-text {
            font-size: clamp(2.1rem, 6vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-main);
            white-space: nowrap;
            position: relative;
        }

        #splash-text {
            opacity: 0;
        }

        /* ================= 主頁面內容容器 ================= */
        .main-wrapper {
            max-width: 760px;
            margin: 0 auto;
            padding: 72px 24px 100px;
        }

        header {
            text-align: center;
            margin-bottom: 70px;
        }

        /* 實際頁面頂部的品牌組合 (與動畫終點 1:1 貼合) */
        #target-brand-lockup {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            opacity: 0;
        }

        #target-brand-lockup.docked {
            opacity: 1;
        }

        .fade-up-content {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.page-ready .fade-up-content {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: 0.08s; }
        .delay-2 { transition-delay: 0.22s; }
        .delay-3 { transition-delay: 0.36s; }

        .hero-desc {
            font-size: 1.15rem;
            color: var(--text-sub);
            max-width: 520px;
            margin: 0 auto;
        }

        /* 1) 應用程式介紹卡片 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 42px;
            text-align: left;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.025);
            transition: transform 0.25s ease;
        }

        .feature-card:hover {
            transform: translateY(-3px);
        }

        .feature-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .feature-card p {
            font-size: 0.93rem;
            color: var(--text-sub);
        }

        /* 2) 創作理念區塊 */
        .philosophy-section {
            margin: 64px 0;
            padding: 42px 34px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.025);
        }

        .section-tag {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #6b538c;
            margin-bottom: 10px;
            display: block;
        }

        .philosophy-section h2 {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: -0.01em;
        }

        .philosophy-section p {
            color: #4a4a4e;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .philosophy-section p:last-child {
            margin-bottom: 0;
        }

        /* 3) 支持開發區塊 */
        .support-section {
            text-align: center;
            padding: 52px 30px;
            background: linear-gradient(180deg, #ffffff 0%, #f3f2f7 100%);
            border-radius: 24px;
            border: 1px solid var(--border-light);
        }

        .support-section h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .support-section p {
            color: var(--text-sub);
            max-width: 480px;
            margin: 0 auto 28px;
            font-size: 0.96rem;
        }

        .coffee-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--coffee-bg);
            color: #000000;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(255, 221, 0, 0.4);
            transition: all 0.25s ease;
        }

        .coffee-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 221, 0, 0.6);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .replay-btn {
            margin-top: 14px;
            background: none;
            border: 1px solid var(--border-light);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .replay-btn:hover {
            color: var(--text-main);
            border-color: var(--text-sub);
        }
    </style>
</head>
<body class="animating">

    <!-- ================= 開場全螢幕動畫舞台 ================= -->
    <div id="splash-overlay">
        <div id="anim-stage">
            
            <!-- 60fps 連續線條變形層 -->
            <svg id="morph-svg-layer" viewBox="-360 -140 720 280">
                <defs>
                    <!-- ===== 一體成型、頭尾100%融合無懸空線條的原圖故事罐路徑 ===== -->
                    <!-- 1. 瓶蓋 -->
                    <path id="ref-jar-lid" d="M -37 -67 L 37 -67 C 46 -67, 48 -63, 48 -56 C 48 -49, 46 -45, 37 -45 L -37 -45 C -46 -45, -48 -49, -48 -56 C -48 -63, -46 -67, -37 -67 Z" />
                    
                    <!-- 2. 瓶身主粗線 (右下角僅微幅內收，讓飛白細線緊貼瓶身不脫落) -->
                    <path id="ref-jar-body" d="M -39 -44 C -40 -31, -63 -23, -64 4 C -65 20, -65 42, -59 58 C -53 72, -38 76, -12 76 C 14 76, 33 74, 46 65 C 56 58, 61 44, 63 24 C 64 12, 64 4, 63 -4 C 61 -24, 40 -31, 39 -44" />
                    
                    <!-- 3. 【右下角一體成型飛白】起點(66.8, 20)與終點(10, 79.8)完全埋入主瓶身粗線內，僅在轉角處形成緊密的細微月牙留白，絕無掉出來的懸空感 -->
                    <path id="ref-jar-bristle1" d="M 66.8 20 C 67.2 42, 63.5 60, 55.2 69.2 C 47.0 77.5, 31.5 80.2, 10.0 79.8" />
                    
                    <!-- 4. 【右下角內層極細筆觸過渡】同樣頭尾完全收進主線內 -->
                    <path id="ref-jar-bristle2" d="M 65.5 30 C 64.5 47, 59.5 60, 50.5 68.5 C 43.0 74.5, 30.0 77.5, 16.0 77.5" />

                    <!-- 5. 中央圓環 -->
                    <path id="ref-jar-circle" d="M 0 -18 C 18 -18, 32 -4, 32 14 C 32 32, 18 46, 0 46 C -18 46, -32 32, -32 14 C -32 -4, -18 -18, 0 -18 Z" />

                    <!-- 6. 圓環內左上反光弧線 -->
                    <path id="ref-jar-arc" d="M -17 14 C -16.5 3.5, -8.5 -3.5, 1.5 -3.5" />

                    <!-- ===== 無限符號 ♾️ 左右迴圈路徑 ===== -->
                    <path id="ref-inf-left" d="M 0 0 C -16 -32, -68 -32, -68 0 C -68 32, -16 32, 0 0 Z" />
                    <path id="ref-inf-right" d="M 0 0 C 16 -32, 68 -32, 68 0 C 68 32, 16 32, 0 0 Z" />

                    <!-- ===== 左圈化為 YourStory 的橫向書寫流線軌跡 ===== -->
                    <path id="ref-text-wave1" d="M -85 4 C -55 -18, -25 18, 0 -12 C 28 16, 58 -16, 85 2" />
                </defs>

                <!-- 實際參與旋轉與變形的 6 道畫筆路徑 -->
                <g id="morph-strokes-group">
                    <path id="m-lid" fill="none" stroke="#1e1c24" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="m-body" fill="none" stroke="#1e1c24" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="m-bristle1" fill="none" stroke="#1e1c24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="m-bristle2" fill="none" stroke="#1e1c24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="m-circle" fill="none" stroke="#1e1c24" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="m-arc" fill="none" stroke="#1e1c24" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round" />

                    <!-- 左側文字一筆一劃描邊生成層 -->
                    <text id="svg-writing-text" text-anchor="middle" dominant-baseline="central"
                          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
                          font-size="42" font-weight="800" letter-spacing="-1.2"
                          fill="rgba(29, 29, 31, 0)" stroke="#1e1c24" stroke-width="2.2"
                          stroke-dasharray="320" stroke-dashoffset="320" opacity="0">YourStory</text>
                </g>
            </svg>

            <!-- 分裂後的實體元素 (YourStory + 罐子：上升時為純黑線罐子，到達頂部後絲滑上色並浮現背景) -->
            <div id="split-lockup">
                <span id="splash-text" class="brand-title-text">YourStory</span>
                <div id="splash-icon2" class="app-icon-squircle">
                    <svg viewBox="-90 -90 180 185">
                        <defs>
                            <linearGradient id="holo-grad-splash" gradientUnits="userSpaceOnUse" x1="-65" y1="-65" x2="65" y2="80">
                                <stop offset="0%" stop-color="#ffc8d8" />
